services:
  - type: web
    name: recipe-manager-app
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://zodvot.github.io
